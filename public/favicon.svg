<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- PureSlate 品牌标「石板对勾」：深石板靛蓝圆角底 + 单一白色对勾。
       只有一个主形，不依赖细节；16px 下仍可辨识（见 tools/gen-icons.py 产物）。 -->
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22355F" />
      <stop offset=".55" stop-color="#16264A" />
      <stop offset="1" stop-color="#0F1C39" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".07" />
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#slate)" />
  <rect width="1024" height="1024" rx="228" fill="url(#sheen)" />
  <path
    d="M286 522l150 150 306-316"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="124"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
