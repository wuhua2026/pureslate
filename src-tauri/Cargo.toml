[package]
name = "pureslate"
version = "0.1.0"
description = "PureSlate - Windows PC cleaning tool (Tauri 2 + Rust kernel)"
authors = ["PureSlate Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pureslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
thiserror = "1"
walkdir = "2"
globset = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# P1-02b（MFT 直读枚举）：零第三方依赖。所需少量 Windows 原生 API
# （卷句柄/USN 枚举/提权判定）以 `#[link]` extern "system" 薄封装直调
# kernel32/advapi32，无 crate、无重量运行时、link 尺寸影响极小（维持 <20MB 门禁）。
# 依赖决策依据 AGENTS §4.7，记入 TASKS.md P1-02b 备注。

