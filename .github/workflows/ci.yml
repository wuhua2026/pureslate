name: PureSlate CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  RUSTFLAGS: ""
  # 说明（P4-06）：曾配置 RUSTUP_DIST_SERVER=rsproxy.cn 以为可"加速"，但 Actions
  # runner 在海外，连国内镜像反而不稳（2026-10-04 实测连接被远端强制断开致 CI
  # 假失败）——移除，使用 rustup 官方默认源。

jobs:
  rust-checks:
    name: Rust fmt/clippy/test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  frontend-checks:
    name: Frontend typecheck/test/build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: vitest
        run: pnpm test

      - name: vite build
        run: pnpm build

  tauri-package-size:
    name: Tauri package + size gate <20MB
    runs-on: windows-latest
    needs: [rust-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Tauri build (NSIS)
        run: pnpm tauri build --bundles nsis

      - name: Size gate check
        shell: pwsh
        run: |
          .\tools\check-size.ps1 -SearchPath "src-tauri/target/release/bundle" -ResultFile "docs/verify/ci-size-report.json"
          if ($LASTEXITCODE -ne 0) { throw "Size gate FAILED" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pureslate-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      # CI 产物体积报告作为 P0-06 基准来源（若本机未装工具链）
      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: docs/verify/ci-size-report.json