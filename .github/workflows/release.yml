name: Release (R26)

# P4-06 签名与发布流水线：tag 触发 → 双构建一致性校验 → 体积门禁 →
# update-manifest 生成 →（可选）SignPath 签名 → GitHub Release 上传 →
# manifest/规则包提交回 main（jsDelivr/ghproxy/raw 更新通道读取处，P4-01）。
#
# 占位项（定稿后单点改动，见 TASKS P4-06 备注）：
# - SignPath 签名：配置 SIGNPATH_API_TOKEN / SIGNPATH_ORG_ID / SIGNPATH_PROJECT_ID
#   / SIGNPATH_SIGNING_POLICY_SLUG secrets 后自动启用；未配置时产出未签名占位包；
# - REPO_SLUG：已定稿 wuhua2026/pureslate（发布侧取 GITHUB_REPOSITORY，与
#   updates/mod.rs 常量一致）；
# - 崩溃上传端点（crash::CRASH_UPLOAD_URL）：后端定稿后更新。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RUSTFLAGS: ""

jobs:
  build-publish:
    name: Build + verify + publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # ---- tag 与应用版本一致性校验（P4-06 补强：防 tag 打在版本不符的 commit 上）----
      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($tag -ne "v$($conf.version)") {
            throw "tag ($tag) 与 tauri.conf.json version (v$($conf.version)) 不一致——tag 可能打在了内容不符的 commit 上"
          }
          Write-Host "tag=$tag 与应用版本一致"

      # ---- 构建 #1（记录 exe 哈希，可重复构建基准）----
      - name: Tauri build #1 (NSIS)
        run: pnpm tauri build --bundles nsis

      - name: Record exe hash (build #1)
        id: hash1
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/pureslate.exe"
          if (-not (Test-Path $exe)) { throw "release exe 不存在: $exe" }
          $h = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "sha256=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          Write-Host "build#1 exe sha256=$h"

      # ---- 构建 #2（重建并记录哈希）----
      # 说明（2026-10-04）：原设计为"两次构建 exe 字节一致"的可重复构建断言，
      # 实测 Windows MSVC 链接器默认在 PE 头嵌入时间戳，exe 哈希每次必变——
      # 字节级可重复需 /Brepro + SOURCE_DATE_EPOCH 等深度改造（挂账 TASKS P4-06）。
      # 当前降级为**记录**：两次哈希写入 build-hashes.json 随 Release 发布供外部核对。
      - name: Rebuild (cargo clean -p pureslate)
        run: |
          cd src-tauri
          cargo clean -p pureslate

      - name: Tauri build #2 (NSIS)
        run: pnpm tauri build --bundles nsis

      - name: Record build hashes
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/pureslate.exe"
          if (-not (Test-Path $exe)) { throw "release exe 不存在: $exe" }
          $h = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force -Path "dist-publish" | Out-Null
          @{
            note = "Windows MSVC PE 头含链接时间戳，两次构建 exe 哈希必然不同；字节级可重复性待 /Brepro 改造（TASKS P4-06）。本文件供外部核对构建稳定性。"
            exeBuild1 = "${{ steps.hash1.outputs.sha256 }}"
            exeBuild2 = $h
          } | ConvertTo-Json | Set-Content -Path "dist-publish/build-hashes.json" -Encoding utf8NoBOM
          Write-Host "build#1=${{ steps.hash1.outputs.sha256 }}"
          Write-Host "build#2=$h"

      # ---- 体积门禁（<20MB，R26 保持）----
      - name: Size gate check
        shell: pwsh
        run: |
          .\tools\check-size.ps1 -SearchPath "src-tauri/target/release/bundle" -ResultFile "docs/verify/ci-size-report.json"
          if ($LASTEXITCODE -ne 0) { throw "Size gate FAILED" }

      # ---- 发布清单（规则包 + update-manifest）----
      - name: Generate rules pack + update manifest
        shell: pwsh
        run: .\tools\publish-manifest.ps1

      # ---- 便携版 zip（v0.1.1 起：exe + rules/ + 说明，免安装形态）----
      - name: Build portable zip
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $stage = "dist-publish/portable/PureSlate-$version-portable"
          New-Item -ItemType Directory -Force -Path "$stage/rules" | Out-Null
          Copy-Item "src-tauri/target/release/pureslate.exe" $stage
          # 便携包规则与安装版同源（bundle 资源同一段配置），whitelist.xml 全量随包。
          Copy-Item "src-tauri/resources/rules/*.xml" "$stage/rules/"
          Copy-Item "tools/portable-readme.txt" "$stage/README.txt"
          Compress-Archive -Path $stage -DestinationPath "dist-publish/PureSlate-$version-portable.zip" -Force
          Write-Host "portable zip: dist-publish/PureSlate-$version-portable.zip"

      # ---- 可选签名（SignPath 免费开源计划；secrets 配置后自动启用）----
      - name: Sign installer (SignPath, optional)
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          Write-Host "SignPath 签名步骤占位：开源计划审批通过并配置 secrets 后启用。"
          Write-Host "计划接入方式：SignPath CLI（signpath）对 bundle/nsis/*.exe 提交签名并等待完成，"
          Write-Host "签名策略与项目配置在 SignPath 控制台维护（P4-06 TASKS 备注跟进）。"
          # 占位实现：未配置 secrets 前发布未签名包（SmartScreen 警告属预期，README 免责声明覆盖）。

      # ---- 上传 GitHub Release（安装包 + 规则包）----
      - name: Upload GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $installer = "src-tauri/target/release/bundle/nsis/PureSlate_${version}_x64-setup.exe"
          $rulesPack = "dist-publish/rules/pureslate-rules-$version.json"
          $portable = "dist-publish/PureSlate-$version-portable.zip"
          # Release 页功能文档：`.github/release-notes/<tag>.md` 存在则用作正文
          #（Foundation 条款要求功能在下载页有文档）；否则退回自动生成。
          $notes = ".github/release-notes/$tag.md"
          if (Test-Path $notes) {
            gh release create "$tag" "$installer" "$portable" "$rulesPack" "dist-publish/build-hashes.json" --title "PureSlate $tag" --notes-file $notes
          } else {
            gh release create "$tag" "$installer" "$portable" "$rulesPack" "dist-publish/build-hashes.json" --title "PureSlate $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release create 失败" }

      # ---- manifest/规则包提交回 main（更新通道读取处）----
      - name: Push manifest back to main
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # -f：构建过程可能对工作区产生残留改动（如 Cargo.toml 时间戳/版本同步），
          # 强制切换丢弃之；update-manifest.json/rules 为新拷贝文件不受影响。
          git checkout -f main
          New-Item -ItemType Directory -Force -Path "rules" | Out-Null
          Copy-Item "dist-publish/update-manifest.json" "update-manifest.json" -Force
          Copy-Item "dist-publish/rules/pureslate-rules-$version.json" "rules/" -Force
          git add update-manifest.json rules/
          git commit -m "release: update-manifest + rules pack for $env:GITHUB_REF_NAME [skip ci]"
          git push origin main
          if ($LASTEXITCODE -ne 0) { throw "manifest 回推 main 失败" }
